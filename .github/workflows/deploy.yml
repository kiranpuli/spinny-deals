name: Daily Spinny Deal Refresh & Deploy

on:
  schedule:
    # Runs at 03:00 UTC (08:30 AM IST) daily
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Fetch Fresh Bangalore Deals
        run: |
          python spinny_checker.py --city bangalore --max-price 500000

      - name: Commit and Push Updated Data (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html deals.html clean_bangalore_cars.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: refresh Bangalore deals [skip ci]" && git push)

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
